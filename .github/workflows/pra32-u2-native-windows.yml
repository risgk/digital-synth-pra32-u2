# PRA32-U2 Build: the UF2 files ("bin/") and PRA32-U2 Native for Windows ("PRA32-U2-Native/bin/")
# - UF2: built with arduino-cli (Ubuntu), the same as the Arduino IDE builds (see README.md)
# - PRA32-U2 Native: built with Visual Studio 2022 (Windows) and validated with pluginval (see PRA32-U2-Native/README.md)
# (The file name is kept, because the "Run workflow" button needs this file on the default branch)
name: PRA32-U2 Build (UF2 and Native)

on:
  workflow_dispatch:  # Manual runs only (e.g. at a release)
    inputs:
      commit_package:
        description: 'Commit the UF2 files (bin/) and the package (zip, PRA32-U2-Native/bin/) on the selected branch'
        type: boolean
        default: false

permissions:
  contents: read

env:
  ARDUINO_CLI_VERSION: '1.5.1'
  ARDUINO_PICO_VERSION: '6.2.0'  # The same as "Tested with Arduino-Pico version ..." in PRA32-U2-Change-History.md
  MIDI_LIBRARY_VERSION: '5.0.2'
  ARDUINO_PICO_INDEX_URL: 'https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json'
  UF2_FQBN: 'rp2040:rp2040:rpipico2:flash=4194304_0,freq=150,arch=arm,opt=Small,os=none,profile=Disabled,rtti=Disabled,stackprotect=Disabled,exceptions=Disabled,dbgport=Disabled,dbglvl=None,usbstack=tinyusb,ipbtstack=ipv4only,uploadmethod=default'

jobs:
  uf2:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.build.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Install the core and the library
        run: |
          arduino-cli core update-index --additional-urls "$ARDUINO_PICO_INDEX_URL"
          arduino-cli core install "rp2040:rp2040@$ARDUINO_PICO_VERSION" --additional-urls "$ARDUINO_PICO_INDEX_URL"
          arduino-cli lib install "MIDI Library@$MIDI_LIBRARY_VERSION"

      - name: Build (PRA32-U2 and PRA32-U2/M)
        id: build
        run: |
          version=$(sed -n 's/^#define PRA32_U2_VERSION *"v\([0-9.]*\).*/\1/p' Digital-Synth-PRA32-U2/Digital-Synth-PRA32-U2.ino)
          echo "name=PRA32-U2-UF2-v$version" >> "$GITHUB_OUTPUT"
          mkdir -p uf2

          # PRA32-U2
          arduino-cli compile --fqbn "$UF2_FQBN" --output-dir out/u2 Digital-Synth-PRA32-U2
          cp out/u2/Digital-Synth-PRA32-U2.ino.uf2 uf2/Digital-Synth-PRA32-U2-Pimoroni-Pico-Audio-Pack.uf2

          # PRA32-U2/M: "Digital-Synth-PRA32-U2-M.ino" with the files in the "Digital-Synth-PRA32-U2" folder
          mkdir -p work
          cp -r Digital-Synth-PRA32-U2 work/
          cp Digital-Synth-PRA32-U2-M/Digital-Synth-PRA32-U2-M.ino work/Digital-Synth-PRA32-U2/Digital-Synth-PRA32-U2.ino
          arduino-cli compile --fqbn "$UF2_FQBN" --output-dir out/m work/Digital-Synth-PRA32-U2
          cp out/m/Digital-Synth-PRA32-U2.ino.uf2 uf2/Digital-Synth-PRA32-U2-M-Pimoroni-Pico-Audio-Pack.uf2

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: uf2

  native:
    runs-on: windows-2022
    outputs:
      name: ${{ steps.package.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S PRA32-U2-Native -B PRA32-U2-Native/build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build PRA32-U2-Native/build --config Release --parallel

      - name: Validate (pluginval)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level 10 --validate "PRA32-U2-Native\build\PRA32_U2_Native_artefacts\Release\VST3\PRA32-U2 Native.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (VST3 and Standalone)
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content "PRA32-U2-Native\build\pra32-u2-native-version.txt" -Raw).Trim()
          $name = "PRA32-U2-Native-v$version-Windows-x64"
          "name=$name" >> $env:GITHUB_OUTPUT
          $out = "package\$name"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item -Recurse "PRA32-U2-Native\build\PRA32_U2_Native_artefacts\Release\VST3\PRA32-U2 Native.vst3" $out
          Copy-Item "PRA32-U2-Native\build\PRA32_U2_Native_artefacts\Release\Standalone\PRA32-U2 Native.exe" $out
          Copy-Item "PRA32-U2-Native\README.md" $out
          Copy-Item "PRA32-U2-Native\LICENSE-AGPLv3.txt" $out
          Copy-Item "PRA32-U2-Native\build\_deps\juce-src\modules\juce_audio_processors_headless\format_types\VST3_SDK\LICENSE.txt" "$out\LICENSE-VST3-SDK.txt"
          Copy-Item "PRA32-U2-Native\build\_deps\juce-src\LICENSE.md" "$out\LICENSE-JUCE.md"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: package/${{ steps.package.outputs.name }}

  commit:
    if: inputs.commit_package
    needs: [uf2, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.uf2.outputs.name }}
          path: uf2

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.native.outputs.name }}
          path: package/${{ needs.native.outputs.name }}

      - name: Commit the UF2 files and the package
        run: |
          name="${{ needs.native.outputs.name }}"
          branch="${{ github.ref_name }}"
          git fetch -q origin "$branch"

          # Not committed if the sources were changed after this build (the binaries would be older than the sources)
          changed=$(git diff --name-only "${{ github.sha }}" "origin/$branch" -- . ":(exclude)bin" ":(exclude)PRA32-U2-Native/bin" ":(exclude).github")
          if [ -n "$changed" ]; then
            echo "::warning::Not committed: the sources were changed after ${{ github.sha }} (run this workflow again)"
            echo "$changed" | sed 's/^/  /'
            exit 0
          fi

          # Committed on the latest branch (e.g. after the binaries committed by another run)
          git checkout -q -B "$branch" "origin/$branch"
          cp uf2/*.uf2 bin/
          git rm -q --ignore-unmatch "PRA32-U2-Native/bin/*.zip"  # Only the latest package is kept
          mkdir -p PRA32-U2-Native/bin  # After git rm, which removes the empty folder
          (cd package && zip -q -r "../PRA32-U2-Native/bin/$name.zip" "$name")
          git add bin "PRA32-U2-Native/bin/$name.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the UF2 files and the PRA32-U2 Native package: $name" -m "Built by ${{ github.workflow }} run #${{ github.run_number }} from ${{ github.sha }}"
          git push origin "HEAD:$branch"
